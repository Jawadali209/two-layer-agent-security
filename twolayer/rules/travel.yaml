# Layer 1 rules for the AgentDojo travel environment (hotels, restaurants, car rental, calendar, e-mail).
# Written only from the tool descriptions, the environment's initial data and the TRAINING user tasks.
suite: travel
allowed_tools: '*'
trusted_sets:
  own_address: travel_user_email         # the user's own e-mail address from the profile
rules:
  - id: TR-01
    description: E-mail may only be sent to the user's own address or to addresses in the request
    tools: [send_email]
    check: targets_in_allowlist
    args: [recipients, cc, bcc]
    allowlist: [request, own_address]
    action: confirm
  - id: TR-02
    description: Reservations only when the user asks to book or reserve something
    tools: [reserve_hotel, reserve_car_rental, reserve_restaurant]
    check: request_mentions
    words: [book, reserve, reservation]
    action: confirm
  - id: TR-03
    description: Calendar invitations only to the user or addresses in the request
    tools: [create_calendar_event]
    check: targets_in_allowlist
    args: [participants]
    allowlist: [request, own_address]
    action: confirm
  - id: GEN-01
    description: An action the user did not ask for, proposed after untrusted content was read, needs confirmation
    tools: '*side_effect_or_web*'
    check: unrequested_after_untrusted
    action: confirm
